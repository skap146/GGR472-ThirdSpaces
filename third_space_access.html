<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <!-- head link: boostrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- viewport for mapbox -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Import Mapbox and Mapbox JS -->
  <script src='https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css' rel='stylesheet' />

  <!-- Import Mapbox Geocoder Plugin -->
  <script
          src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet"
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.css"
        type="text/css">

  <!-- Import Turf JS (necessary for this page specifically) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

  <!-- link to css stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- body script: boostrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<!-- menu navigation -->
<div id="sidebar" class="side_menu">
  <h1 class="menu_text">Menu</h1>
  <a href="index.html" class="menu_link">Background</a>
  <a href="third_space_access.html" class="menu_link">Third Space <br> Walkability Map</a>
  <a href="ct_rankings.html" class="menu_link">CT Third Space <br> Rankings Map</a>
</div>


<!-- main page content (groups all page content so it can pushed when menu is displayed) --->
<div id="main">
  <!-- title and paragraph text -->
  <div class="background_pg_title text-center">Third Spaces: How Accessible Are They?.</div>
  <p class="text-center"> <br><br> Third spaces are critical spaces to facilitate social interactions, yet
    are they easily accessible? Explore this map to find out!.</p>

  <!-- Searching for a third space functionality -->
  <div class="row">
    <div class="col-md-6">
      <!-- Filter third space options by name -->
      <div class="form-group">
        <label for="search_string" class="dropdown-title">Name Filter:</label>
        <input type="email" class="form-control" id="search_string" placeholder="Filter by third space name" onchange="filterByName(value)">
      </div>
    </div>
    <div class="col-md-6">
      <!-- Third space selection  -->
      <div class="form-group">
        <label for="search_third_space" class="dropdown-title">Search for Third Space:</label>
        <select id="search_third_space" class="form-control">
          <option class="placeholder" selected disabled hidden>Choose an Option</option>
        </select>
        <a class="btn btn-danger" id="enter_btn">Enter</a>
      </div>
      </div>
  </div>

  <!-- webpage map --->
  <div id="my-map" class="map_container">
    <!-- toggle/filter third space types -->
    <div id="layer_toggle">
      <h4 class="text-center"> Layer Toggle </h4>
      <label>
        <input type="checkbox" value="library_point" onchange="toggleLayer(value)" checked>
        Libraries
      </label><br>
      <label>
        <input type="checkbox" value="early_child_centre_point" onchange="toggleLayer(value)" checked>
        EarlyON Child Centres
      </label><br>
      <label>
        <input type="checkbox" value="comm_centre_point" onchange="toggleLayer(value)" checked>
        Community Centres
      </label><br>
      <label>
        <input type="checkbox" value="places_of_worship_point" onchange="toggleLayer(value)" checked>
        Places of Worship
      </label><br>
    </div>

  <!-- menu button -->
  <div class="btn btn-primary" id="menu_btn">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<!-- link to menu handler script -->
<script src="js/menu.js"></script>

<!-- link to third space map script -->
<script src="js/third_space_map.js"></script>

</div>
</body>
</html>
